[package]
name = "cat-gh-repo-creator"
version = "0.1.0"
edition = "2021"
description = "Interactively publish local Rust projects to GitHub via TUI"

[[bin]]
name = "cat-gh-repo-creator"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ratatui-textarea = { version = "0.9", features = ["crossterm"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
walkdir = "2.5"
clap = { version = "4.6.0", features = ["derive"] }
cat-self-update-lib = { git = "https://github.com/cat2151/cat-self-update", branch = "main", package = "cat-self-update-lib" }

[dev-dependencies]
tempfile = "3.10"

[package]
name = "cat-gh-repo-creator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cat-gh-repo-creator"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"
